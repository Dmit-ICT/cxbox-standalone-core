version: '3'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - /Users/bomdmit/DockerVolumes/cxbox-standalone-volume:/data/postgres
    environment:
      - POSTGRES_DB=standalone_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password1234!

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    ports:
      - '6379:6379'
    volumes:
      - redis:/data/redis

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

volumes:
  redis: